name: ✅ CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # The homecoming date is written in four places: the JS constant that actually
  # drives the countdown, two prose renderings on the page, and the README. Only
  # the constant changes behaviour, so the other three can drift silently and the
  # page will count down to one date while telling the reader another.
  date-consistency:
    name: Date Consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📅 Every rendered date matches the countdown target
        run: |
          set -euo pipefail

          # Validate EVERY date constant the page constructs, not just TARGET.
          # START drives the progress bar, so a malformed value there renders NaN
          # just as visibly — and a TARGET-only check would pass over it.
          validate_ts() { # name, value
            local n="$1" v="$2"
            # The WHOLE timestamp, not just the calendar prefix: a valid date with
            # a malformed time — 2026-08-24T25:00:00+02:00 — is an Invalid Date in
            # the browser while a prefix-only check still passes.
            if [[ ! "$v" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T([0-9]{2}):([0-9]{2}):([0-9]{2})(\.[0-9]+)?(Z|[+-]([0-9]{2}):([0-9]{2}))$ ]]; then
              echo "::error::${n} is not a well-formed RFC 3339 timestamp: ${v}"
              return 1
            fi
            local hh="${BASH_REMATCH[1]}" mm="${BASH_REMATCH[2]}" ss="${BASH_REMATCH[3]}"
            # The OFFSET fields too. +24:00 and +02:60 are both shape-valid and
            # both Invalid Date, so stopping at the clock leaves NaN reachable.
            local oh="${BASH_REMATCH[6]:-0}" om="${BASH_REMATCH[7]:-0}"
            # 10#: zero-padded, and bash reads a leading zero as octal.
            if ((10#$hh > 23 || 10#$mm > 59 || 10#$ss > 59)); then
              echo "::error::${n} has an out-of-range time: ${v}"
              return 1
            fi
            if ((10#$oh > 23 || 10#$om > 59)); then
              echo "::error::${n} has an out-of-range UTC offset: ${v}"
              return 1
            fi
            # The calendar date must be real too; date -u rejects 2026-02-30.
            if ! date -u -d "${v%%T*}" >/dev/null 2>&1; then
              echo "::error::${n} is not a real calendar date: ${v}"
              return 1
            fi
            echo "  ✅ ${n} = ${v}"
          }

          ts_status=0
          found_any=0
          while IFS= read -r line; do
            name=${line%%=*}; name=${name// /}
            value=$(printf '%s' "$line" | grep -oE "'[^']+'" | tr -d "'")
            found_any=1
            validate_ts "$name" "$value" || ts_status=1
          done < <(grep -oE "[A-Z_]+ *= *new Date\('[^']+'\)" public/index.html || true)

          if [ "$found_any" != 1 ]; then
            echo "::error::found no 'new Date(...)' constants in public/index.html"
            exit 1
          fi
          [ "$ts_status" = 0 ] || exit 1

          iso=$(grep -oE "TARGET *= *new Date\('[^']+'\)" public/index.html \
            | grep -oE "[0-9]{4}-[0-9]{2}-[0-9]{2}T[^']*" || true)
          if [ -z "$iso" ]; then
            echo "::error::could not find the TARGET date in public/index.html"
            exit 1
          fi

          # Compare the RENDERED prose against the calendar date only. Converting
          # the full timestamp would reinterpret midnight +02:00 as 22:00 UTC the
          # PREVIOUS day on this runner, so every rendering would be checked
          # against the wrong weekday.
          day="${iso%%T*}"
          long=$(date -u -d "$day" +'%A %-d %B %Y')
          short=$(date -u -d "$day" +'%a %-d %b %Y')

          echo "countdown target: $iso"
          echo "expected long   : $long"
          echo "expected short  : $short"

          status=0
          check() { # file, expected string
            if grep -qF "$2" "$1"; then
              echo "  ✅ $1 carries '$2'"
            else
              echo "::error::$1 does not carry '$2' — it has drifted from the countdown target"
              status=1
            fi
          }

          check public/index.html "$long"
          check public/index.html "$short"
          check README.md "$long"

          exit "$status"

  # No separate build job: container-smoke builds the same image with the same
  # command, so a build failure already fails it. A standalone build job would
  # double the image build per pull request while adding no signal.
  container-smoke:
    name: Container Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐳 Build the image
        run: docker build -t doggy-countdown:ci .

      # Exercises the image under the SAME restrictions the Deployment imposes,
      # all derived from deploy/deployment.yaml rather than restated here.
      #
      # An unrestricted `docker run` is close to worthless as a pre-deploy check:
      # the pod runs as UID/GID 1000 with a read-only root and exactly three
      # writable mounts, so an image that needs to write anywhere else — or that
      # only works as root — passes an unrestricted smoke test and then
      # CrashLoopBackOffs in production. Mirroring the restrictions is what makes
      # a green here mean "this will start".
      - name: 🔥 The container serves the countdown under production restrictions
        run: |
          set -euo pipefail

          # `|| true` on every extraction. Without it a no-match grep ends the
          # step under `set -e`/`pipefail` BEFORE the fail-closed checks below can
          # report which field went missing — the guard exists precisely for that
          # case, so letting the step die first makes it unreachable.
          port=$(grep -oE 'containerPort: *[0-9]+' deploy/deployment.yaml \
            | grep -oE '[0-9]+' | head -1 || true)
          user=$(grep -oE 'runAsUser: *[0-9]+' deploy/deployment.yaml | grep -oE '[0-9]+' | head -1 || true)
          group=$(grep -oE 'runAsGroup: *[0-9]+' deploy/deployment.yaml | grep -oE '[0-9]+' | head -1 || true)
          ro_root=$(grep -oE 'readOnlyRootFilesystem: *(true|false)' deploy/deployment.yaml \
            | awk '{print $2}' | head -1 || true)
          # read-loop rather than mapfile: portable to any bash, and testable
          # outside the runner. mapfile is a bash 4 builtin that yields an empty
          # array instead of an error on older shells.
          mount_paths=()
          while IFS= read -r p; do mount_paths+=("$p"); done < <(
            grep -oE 'mountPath: *[^ ]+' deploy/deployment.yaml | awk '{print $2}' || true
          )

          # Fail closed rather than silently smoke-testing an unrestricted
          # container because a field moved or was renamed.
          for v in port user group ro_root; do
            if [ -z "${!v}" ]; then
              echo "::error::could not read '${v}' from deploy/deployment.yaml"
              exit 1
            fi
          done
          if [ "${#mount_paths[@]}" -eq 0 ]; then
            echo "::error::no volumeMounts found in deploy/deployment.yaml"
            exit 1
          fi

          args=(--user "${user}:${group}" --cap-drop ALL --security-opt no-new-privileges)
          [ "$ro_root" = "true" ] && args+=(--read-only)
          for m in "${mount_paths[@]}"; do args+=(--tmpfs "$m"); done

          # Host port is this workflow's choice; container port comes from the
          # manifest. Keeping them in separate variables stops the diagnostics
          # naming a port the check never probed.
          host_port=8080
          base="http://localhost:${host_port}"

          echo "mirroring deployment: containerPort=${port} user=${user}:${group} readOnlyRoot=${ro_root}"
          printf '  writable mount: %s\n' "${mount_paths[@]}"

          docker run -d --rm -p "${host_port}:${port}" "${args[@]}" --name doggy-smoke doggy-countdown:ci

          # Fail closed: a homepage that never becomes ready is a broken image.
          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 10 -o /dev/null "${base}/"; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs doggy-smoke || true
            docker stop doggy-smoke
            echo "::error::container did not serve / within 30s (host ${host_port} -> container ${port})"
            exit 1
          fi

          # The image must serve the asset this PR actually checked, not merely
          # something with a 200. Compare against the countdown target, which
          # date-consistency has already pinned to the rendered dates.
          served=$(curl -fsS --max-time 10 "${base}/")

          iso=$(grep -oE "TARGET *= *new Date\('[^']+'\)" public/index.html \
            | grep -oE "[0-9]{4}-[0-9]{2}-[0-9]{2}T[^']*" || true)
          if [ -z "$iso" ] || ! printf '%s' "$served" | grep -qF "$iso"; then
            docker stop doggy-smoke
            echo "::error::the served page does not carry the countdown target ${iso}"
            exit 1
          fi
          echo "✅ served page carries the countdown target ${iso}"

          # Every asset the page references must actually be served. A 200 on /
          # says nothing about them: a missing image still renders the page, just
          # with a broken picture on it. Derived from the page rather than named
          # here, so an asset added later is covered without editing this.
          # Covers both attribute references and CSS url(...) references: the
          # page carries inline CSS, so a background-image would otherwise be
          # invisible here and break in production exactly like a missing <img>.
          assets=()
          while IFS= read -r a; do assets+=("$a"); done < <(
            # `|| true` on EVERY extractor. grep exits 1 when it matches
            # nothing, and under `set -e` that aborts the whole group — so an
            # earlier pattern with no matches silently disables every later one.
            # The checked-in page has no single-quoted attributes, which made
            # the CSS extractor below dead code until this was fixed.
            {
              # Single-quoted attributes are valid HTML, so match both quote
              # styles: a src='...' asset would otherwise never be requested.
              grep -oE "(src|href)=\"[^\"]+\"" public/index.html \
                | sed -E 's/^(src|href)="//; s/"$//' || true
              grep -oE "(src|href)='[^']+'" public/index.html \
                | sed -E "s/^(src|href)='//; s/'$//" || true
              # url( 'x' ) with padding is valid CSS, so allow whitespace and
              # strip the trailing quote the optional opening one implies.
              grep -oE "url\([[:space:]]*(\"|')?[^)\"']+" public/index.html \
                | sed -E "s/^url\\([[:space:]]*(\"|')?//; s/[[:space:]]+$//" || true
            } | grep -vE '^([a-zA-Z]+:|//|#|data:|mailto:)' | grep -v '^$' | sort -u
          )

          status=0
          for a in "${assets[@]}"; do
            if curl -fsS --max-time 10 -o /dev/null "${base}/${a#/}"; then
              echo "  ✅ ${a}"
            else
              echo "::error::referenced asset is not served: ${a}"
              status=1
            fi
          done
          docker stop doggy-smoke
          exit "$status"

  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A manifest that exists but is not listed in kustomization.yaml is never
      # published, so it fails by being silently absent from the cluster rather
      # than by breaking anything here.
      - name: 🧾 Every manifest is referenced by the kustomization
        run: |
          set -euo pipefail
          status=0
          command -v yq >/dev/null || { echo "::error::yq is required by this check"; exit 1; }

          # Validate the kustomization ITSELF before trusting anything in it. A
          # mistyped `resources:` key leaves the filenames sitting in the file
          # where a grep would still find them, so both manifest checks would
          # pass over a kustomization that cannot actually be built.
          kind=$(yq -r '.kind // ""' deploy/kustomization.yaml)
          if [ "$kind" != "Kustomization" ]; then
            echo "::error::deploy/kustomization.yaml has kind '${kind:-<missing>}', expected Kustomization"
            exit 1
          fi
          api=$(yq -r '.apiVersion // ""' deploy/kustomization.yaml)
          if [ "$api" != "kustomize.config.k8s.io/v1beta1" ]; then
            echo "::error::deploy/kustomization.yaml has apiVersion '${api:-<missing>}', which Kustomize would refuse"
            exit 1
          fi
          if [ "$(yq -r '.resources | type' deploy/kustomization.yaml)" != "!!seq" ]; then
            echo "::error::deploy/kustomization.yaml has no 'resources' list — nothing would ship"
            exit 1
          fi

          # Read the entries as VALUES rather than matching them as patterns. An
          # interpolated filename in an ERE makes '.' a wildcard, so a typo like
          # `deploymentXyaml` would match the real deployment.yaml and report it
          # as correctly referenced.
          refs=()
          while IFS= read -r r; do refs+=("$r"); done < <(yq -r '.resources[]' deploy/kustomization.yaml)

          # Both extensions: a manifest added as .yml would otherwise pass this
          # job unchecked and never ship — the exact failure this step exists to
          # catch. nullglob so a missing extension contributes nothing rather
          # than a literal unexpanded pattern.
          shopt -s nullglob
          for f in deploy/*.yaml deploy/*.yml; do
            base=$(basename "$f")
            [ "$base" = "kustomization.yaml" ] && continue
            found=0
            for r in "${refs[@]}"; do [ "$r" = "$base" ] && found=1 && break; done
            if [ "$found" = 1 ]; then
              echo "  ✅ ${base}"
            else
              echo "::error::${base} is not listed in deploy/kustomization.yaml, so it would never ship"
              status=1
            fi
          done

          # And the converse: an entry naming a file that does not exist.
          for r in "${refs[@]}"; do
            if [ ! -f "deploy/${r}" ]; then
              echo "::error::deploy/kustomization.yaml references '${r}', which does not exist"
              status=1
            fi
          done
          exit "$status"

      - name: 📐 Validate manifest schemas
        run: |
          set -euo pipefail

          # Validate exactly the manifests the kustomization references — the set
          # that actually ships. A hard-coded file list would let a newly added,
          # correctly-referenced manifest pass the membership check above and
          # never reach kubeconform at all.
          command -v yq >/dev/null || { echo "::error::yq is required by this check"; exit 1; }

          refs=()
          while IFS= read -r r; do refs+=("$r"); done < <(yq -r '.resources[]' deploy/kustomization.yaml)
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "::error::no manifests referenced from deploy/kustomization.yaml"
            exit 1
          fi
          paths=(); for r in "${refs[@]}"; do paths+=("deploy/${r}"); done
          printf 'validating %s referenced manifest(s)\n' "${#paths[@]}"

          # Capture the exit code instead of letting `set -e` end the step on it.
          # kubeconform exits non-zero for an INVALID resource — the exact case
          # this check exists to report — and dying here would discard the JSON
          # report and print nothing but a status.
          rc=0
          out=$(docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
            -strict -ignore-missing-schemas -output json "${paths[@]}") || rc=$?
          printf '%s\n' "$out" | jq -r '.resources[]? | "  \(.status)  \(.kind)  \(.filename)"' || true

          # These CRDs have no schema in kubeconform's default store, so they are
          # skipped. Declaring WHICH kinds may be skipped — rather than how many —
          # is what stops a core resource silently dropping out of validation: a
          # skipped Deployment fails here instead of reading as a clean run.
          # Pinned to exact apiVersion+kind, not kind alone. `-ignore-missing-schemas`
          # skips anything it has no schema for, so a typo'd group or version —
          # gateway.networking.k8s.io/v999 — is skipped too, and a kind-only
          # exemption would wave through a GVK the cluster cannot serve.
          allowed_skips='[{"v":"gateway.networking.k8s.io/v1","k":"HTTPRoute"},{"v":"cilium.io/v2","k":"CiliumNetworkPolicy"}]'

          # Normalise the status before comparing. kubeconform spells these
          # "statusValid"/"statusSkipped"; matching the bare suffix
          # case-insensitively keeps this check correct either way, rather than
          # resting on a spelling this workflow never verifies.
          bad=$(printf '%s' "$out" | jq -r --argjson allow "$allowed_skips" '
            def norm: (. // "") | ascii_downcase | sub("^status"; "");
            def allowed: . as $r | any($allow[]; .v == $r.version and .k == $r.kind);
            [ .resources[]?
              | select((.status | norm) != "valid")
              | select((((.status | norm) == "skipped") and allowed) | not)
            ] | map("\(.status) \(.version // "?") \(.kind // "?") \(.filename // "?")") | .[]' || true)
          if [ -n "$bad" ]; then
            echo "::error::unexpected validation status (only these kinds may be skipped: ${allowed_skips}):"
            printf '  %s\n' "$bad"
            exit 1
          fi

          # Only now act on kubeconform's own status, so its per-resource report
          # is always printed first. A non-zero exit with nothing in "bad" means
          # it failed for a reason the report does not describe — an unreadable
          # file, a parse error — which must not pass as a clean run.
          if [ "$rc" != 0 ]; then
            echo "::error::kubeconform exited ${rc} without a resource-level finding; see its output above"
            exit 1
          fi
          echo "✅ all ${#paths[@]} referenced manifests validated"

  ci-required-checks:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    needs: [date-consistency, container-smoke, manifests]
    permissions: {}
    if: ${{ always() }}
    steps:
      - name: 📊 Require all CI checks to pass
        uses: devantler-tech/actions/aggregate-job-checks@625b7c0cd5ad4a04f9eb7494298c6d0fa44521ef # v11.0.4
        with:
          job-results: >-
            ${{ needs.date-consistency.result }}
            ${{ needs.container-smoke.result }}
            ${{ needs.manifests.result }}
