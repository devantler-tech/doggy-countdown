name: ✅ CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # The homecoming date is written in four places: the JS constant that actually
  # drives the countdown, two prose renderings on the page, and the README. Only
  # the constant changes behaviour, so the other three can drift silently and the
  # page will count down to one date while telling the reader another.
  date-consistency:
    name: Date Consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📅 Every rendered date matches the countdown target
        run: |
          set -euo pipefail

          iso=$(grep -oE "TARGET *= *new Date\('[^']+'\)" public/index.html \
            | grep -oE "[0-9]{4}-[0-9]{2}-[0-9]{2}T[^']*" || true)
          if [ -z "$iso" ]; then
            echo "::error::could not find the TARGET date in public/index.html"
            exit 1
          fi

          # Take the calendar date only. Converting the full timestamp would
          # reinterpret midnight +02:00 as 22:00 UTC the PREVIOUS day on this
          # runner, so every rendering would be compared against the wrong
          # weekday and date.
          day="${iso%%T*}"
          long=$(date -u -d "$day" +'%A %-d %B %Y')
          short=$(date -u -d "$day" +'%a %-d %b %Y')

          echo "countdown target: $iso"
          echo "expected long   : $long"
          echo "expected short  : $short"

          status=0
          check() { # file, expected string
            if grep -qF "$2" "$1"; then
              echo "  ✅ $1 carries '$2'"
            else
              echo "::error::$1 does not carry '$2' — it has drifted from the countdown target"
              status=1
            fi
          }

          check public/index.html "$long"
          check public/index.html "$short"
          check README.md "$long"

          exit "$status"

  # No separate build job: container-smoke builds the same image with the same
  # command, so a build failure already fails it. A standalone build job would
  # double the image build per pull request while adding no signal.
  container-smoke:
    name: Container Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐳 Build the image
        run: docker build -t doggy-countdown:ci .

      # Exercises the image under the SAME restrictions the Deployment imposes,
      # all derived from deploy/deployment.yaml rather than restated here.
      #
      # An unrestricted `docker run` is close to worthless as a pre-deploy check:
      # the pod runs as UID/GID 1000 with a read-only root and exactly three
      # writable mounts, so an image that needs to write anywhere else — or that
      # only works as root — passes an unrestricted smoke test and then
      # CrashLoopBackOffs in production. Mirroring the restrictions is what makes
      # a green here mean "this will start".
      - name: 🔥 The container serves the countdown under production restrictions
        run: |
          set -euo pipefail

          port=$(grep -oE 'containerPort: *[0-9]+' deploy/deployment.yaml \
            | grep -oE '[0-9]+' | head -1)
          user=$(grep -oE 'runAsUser: *[0-9]+' deploy/deployment.yaml | grep -oE '[0-9]+' | head -1)
          group=$(grep -oE 'runAsGroup: *[0-9]+' deploy/deployment.yaml | grep -oE '[0-9]+' | head -1)
          ro_root=$(grep -oE 'readOnlyRootFilesystem: *(true|false)' deploy/deployment.yaml \
            | awk '{print $2}' | head -1)
          # read-loop rather than mapfile: portable to any bash, and testable
          # outside the runner. mapfile is a bash 4 builtin that yields an empty
          # array instead of an error on older shells.
          mount_paths=()
          while IFS= read -r p; do mount_paths+=("$p"); done < <(
            grep -oE 'mountPath: *[^ ]+' deploy/deployment.yaml | awk '{print $2}'
          )

          # Fail closed rather than silently smoke-testing an unrestricted
          # container because a field moved or was renamed.
          for v in port user group ro_root; do
            if [ -z "${!v}" ]; then
              echo "::error::could not read '${v}' from deploy/deployment.yaml"
              exit 1
            fi
          done
          if [ "${#mount_paths[@]}" -eq 0 ]; then
            echo "::error::no volumeMounts found in deploy/deployment.yaml"
            exit 1
          fi

          args=(--user "${user}:${group}" --cap-drop ALL --security-opt no-new-privileges)
          [ "$ro_root" = "true" ] && args+=(--read-only)
          for m in "${mount_paths[@]}"; do args+=(--tmpfs "$m"); done

          # Host port is this workflow's choice; container port comes from the
          # manifest. Keeping them in separate variables stops the diagnostics
          # naming a port the check never probed.
          host_port=8080
          base="http://localhost:${host_port}"

          echo "mirroring deployment: containerPort=${port} user=${user}:${group} readOnlyRoot=${ro_root}"
          printf '  writable mount: %s\n' "${mount_paths[@]}"

          docker run -d --rm -p "${host_port}:${port}" "${args[@]}" --name doggy-smoke doggy-countdown:ci

          # Fail closed: a homepage that never becomes ready is a broken image.
          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "${base}/"; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs doggy-smoke || true
            docker stop doggy-smoke
            echo "::error::container did not serve / within 30s (host ${host_port} -> container ${port})"
            exit 1
          fi

          # The image must serve the asset this PR actually checked, not merely
          # something with a 200. Compare against the countdown target, which
          # date-consistency has already pinned to the rendered dates.
          served=$(curl -fsS "${base}/")

          iso=$(grep -oE "TARGET *= *new Date\('[^']+'\)" public/index.html \
            | grep -oE "[0-9]{4}-[0-9]{2}-[0-9]{2}T[^']*")
          if ! printf '%s' "$served" | grep -qF "$iso"; then
            docker stop doggy-smoke
            echo "::error::the served page does not carry the countdown target ${iso}"
            exit 1
          fi
          echo "✅ served page carries the countdown target ${iso}"

          # Every asset the page references must actually be served. A 200 on /
          # says nothing about them: a missing image still renders the page, just
          # with a broken picture on it. Derived from the page rather than named
          # here, so an asset added later is covered without editing this.
          assets=()
          while IFS= read -r a; do assets+=("$a"); done < <(
            grep -oE '(src|href)="[^"]+"' public/index.html \
              | sed -E 's/^(src|href)="//; s/"$//' \
              | grep -vE '^([a-zA-Z]+:|//|#|data:|mailto:)' \
              | sort -u
          )

          status=0
          for a in "${assets[@]}"; do
            if curl -fsS -o /dev/null "${base}/${a#/}"; then
              echo "  ✅ ${a}"
            else
              echo "::error::referenced asset is not served: ${a}"
              status=1
            fi
          done
          docker stop doggy-smoke
          exit "$status"

  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A manifest that exists but is not listed in kustomization.yaml is never
      # published, so it fails by being silently absent from the cluster rather
      # than by breaking anything here.
      - name: 🧾 Every manifest is referenced by the kustomization
        run: |
          set -euo pipefail
          status=0
          # Both extensions: a manifest added as .yml would otherwise pass this
          # job unchecked and never ship — the exact failure this step exists to
          # catch. nullglob so a missing extension contributes nothing rather
          # than a literal unexpanded pattern.
          shopt -s nullglob
          for f in deploy/*.yaml deploy/*.yml; do
            base=$(basename "$f")
            [ "$base" = "kustomization.yaml" ] && continue
            if grep -qE "^[[:space:]]*-[[:space:]]+${base}$" deploy/kustomization.yaml; then
              echo "  ✅ ${base}"
            else
              echo "::error::${base} is not listed in deploy/kustomization.yaml, so it would never ship"
              status=1
            fi
          done
          exit "$status"

      - name: 📐 Validate manifest schemas
        run: |
          set -euo pipefail

          # Validate exactly the manifests the kustomization references — the set
          # that actually ships. A hard-coded file list would let a newly added,
          # correctly-referenced manifest pass the membership check above and
          # never reach kubeconform at all.
          refs=()
          while IFS= read -r r; do refs+=("$r"); done < <(
            grep -oE '^[[:space:]]*-[[:space:]]+[A-Za-z0-9._-]+\.ya?ml[[:space:]]*$' \
              deploy/kustomization.yaml | awk '{print $2}'
          )
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "::error::no manifests referenced from deploy/kustomization.yaml"
            exit 1
          fi
          paths=(); for r in "${refs[@]}"; do paths+=("deploy/${r}"); done
          printf 'validating %s referenced manifest(s)\n' "${#paths[@]}"

          out=$(docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
            -strict -ignore-missing-schemas -output json "${paths[@]}")
          printf '%s\n' "$out" | jq -r '.resources[] | "  \(.status)  \(.kind)  \(.filename)"'

          # These CRDs have no schema in kubeconform's default store, so they are
          # skipped. Declaring WHICH kinds may be skipped — rather than how many —
          # is what stops a core resource silently dropping out of validation: a
          # skipped Deployment fails here instead of reading as a clean run.
          allowed_skips='["HTTPRoute","CiliumNetworkPolicy"]'

          # Normalise the status before comparing. kubeconform spells these
          # "statusValid"/"statusSkipped"; matching the bare suffix
          # case-insensitively keeps this check correct either way, rather than
          # resting on a spelling this workflow never verifies.
          bad=$(printf '%s' "$out" | jq -r --argjson allow "$allowed_skips" '
            def norm: (. // "") | ascii_downcase | sub("^status"; "");
            [ .resources[]
              | select((.status | norm) != "valid")
              | select((((.status | norm) == "skipped") and (.kind | IN($allow[]))) | not)
            ] | map("\(.status) \(.kind // "?") \(.filename // "?")") | .[]')
          if [ -n "$bad" ]; then
            echo "::error::unexpected validation status (only these kinds may be skipped: ${allowed_skips}):"
            printf '  %s\n' "$bad"
            exit 1
          fi
          echo "✅ all ${#paths[@]} referenced manifests validated"

  ci-required-checks:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    needs: [date-consistency, container-smoke, manifests]
    permissions: {}
    if: ${{ always() }}
    steps:
      - name: 📊 Require all CI checks to pass
        uses: devantler-tech/actions/aggregate-job-checks@625b7c0cd5ad4a04f9eb7494298c6d0fa44521ef # v11.0.4
        with:
          job-results: >-
            ${{ needs.date-consistency.result }}
            ${{ needs.container-smoke.result }}
            ${{ needs.manifests.result }}
